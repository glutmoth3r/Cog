[package]
name = "cog"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.95"
default-run = "cog"
description = "An experimental expression-oriented language with a compiler and stack VM"
license = "MPL-2.0 OR Apache-2.0"
readme = "README.md"
exclude = [
    "/dev_docs/**",
    "/.codex/**",
    "/.idea/**",
    "/AGENTS.md",
    "/CLAUDE.md",
    "**/*.cogb",
    "**/target/**",
]

[package.metadata.cog]
codename = "Cinamon Roll"

[lib]
name = "cog"
path = "src/lib.rs"

[[bin]]
name = "cog"
path = "src/main.rs"

[[example]]
name = "native_plugin"
path = "examples/native_plugin.rs"
crate-type = ["cdylib"]

[[bench]]
name = "bench_interpreter"
harness = false

[profile.release]
debug = true

[dependencies]
blake3 = "1.8.7"
cranelift-codegen = "=0.135.2"
cranelift-frontend = "=0.135.2"
cranelift-jit = "=0.135.2"
cranelift-module = "=0.135.2"
cranelift-native = "=0.135.2"
logos = "0.16.1"
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
num-bigint = "0.4.8"
num-traits = "0.2.19"

getrandom = "0.3.4"
cap-std = "4.0.3"
libloading = "0.8.9"
tar = { version = "0.4.46", default-features = false }
zstd = "0.13.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
criterion = "0.5"
